[project]
name = "f1-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20",
    "duckdb>=0.9",
    "lightgbm>=4.0",
    "torch>=2.2",
    "requests>=2.31",
    "typer>=0.9",
    "mlflow>=2.12",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
